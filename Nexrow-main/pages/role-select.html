<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexrow — Select Role</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .role-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
    }

    .role-grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(201, 168, 76, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201, 168, 76, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    .role-box {
      position: relative;
      z-index: 1;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }

    .role-logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 2.5rem;
    }

    .role-logo span {
      color: var(--gold);
    }

    .role-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .role-sub {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--text3);
      margin-bottom: 2.5rem;
      letter-spacing: 0.05em;
    }

    .role-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .role-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 2rem 1.5rem;
      cursor: pointer;
      transition: all 0.25s;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .role-card:hover {
      border-color: rgba(201, 168, 76, 0.4);
      transform: translateY(-3px);
    }

    .role-card-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .role-card-name {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .role-card-desc {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--text3);
      line-height: 1.6;
    }

    .role-logout {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--text3);
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      transition: color 0.2s;
    }

    .role-logout:hover {
      color: var(--red);
    }

    @media (max-width: 500px) {
      .role-cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="role-wrap">
    <div class="role-grid-bg"></div>
    <div class="role-box fade-up">
      <div class="role-logo">Ne<span>x</span>row</div>
      <div class="role-title">How would you like to proceed?</div>
      <div class="role-sub">// Select your role for this session</div>
      <div class="role-cards">
        <button class="role-card" id="freelancerCard">
          <div class="role-card-icon">🛠</div>
          <div class="role-card-name">I am a Freelancer</div>
          <div class="role-card-desc">Create deals, deliver services, and get paid securely.</div>
        </button>
        <button class="role-card" id="clientCard">
          <div class="role-card-icon">👤</div>
          <div class="role-card-name">I am a Client</div>
          <div class="role-card-desc">Enter a deal code and pay securely via escrow.</div>
        </button>
      </div>
      <div style="margin-top: 1rem;">
        <span style="font-family:'DM Mono',monospace;font-size:0.68rem;color:var(--text3)" id="userEmail"></span>
      </div>
      <div id="alertBox"></div>
      <button class="role-logout" id="logoutBtn" style="margin-top: 0.5rem;">Logout</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="../js/auth.js"></script>
  <script>

    requireAuth(async (user) => {
      document.getElementById('userEmail').textContent = user.email;
      setupLogout();

      try {
        const { data: profile } = await supabase.from('profiles').select('role').eq('id', user.id).maybeSingle();
        if (profile && profile.role) {
          await redirectByRole(user.id);
          return;
        }
      } catch (e) {
        console.error("Error checking role on load:", e);
      }

      async function setRole(role, redirectUrl) {
        const btnId = role === 'freelancer' ? 'freelancerCard' : 'clientCard';
        document.getElementById(btnId).style.opacity = '0.5';
        try {
          // Upsert the user with the selected role
          const { error } = await supabase.from('profiles').upsert({
            id: user.id,
            full_name: user.user_metadata?.name || user.email,
            role: role
          }, { onConflict: 'id', ignoreDuplicates: true });
          if (error) throw error;
          window.location.href = redirectUrl;
        } catch (e) {
          document.getElementById(btnId).style.opacity = '1';
          document.getElementById('alertBox').innerHTML = `<div class='alert alert-error'>Failed to set role: ${e.message}</div>`;
        }
      }

      document.getElementById('freelancerCard').addEventListener('click', () => {
        setRole('freelancer', 'dashboard.html?role=freelancer');
      });

      document.getElementById('clientCard').addEventListener('click', () => {
        setRole('client', 'client-join.html');
      });
    });
  </script>
</body>

</html>

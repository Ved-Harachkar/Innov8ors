<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexrow — Join Deal</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .join-wrap {
      max-width: 460px;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
    }

    .code-input-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 2rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .code-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--gold);
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      text-align: center;
      padding: 1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s;
    }

    .code-input:focus {
      border-color: var(--gold);
      background: var(--card);
    }

    .code-input::placeholder {
      color: var(--text3);
      font-size: 1.2rem;
      font-weight: 400;
      letter-spacing: 0.1em;
    }

    .deal-preview {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      display: none;
    }

    .deal-preview.show {
      display: block;
      animation: fadeUp 0.3s ease both;
    }

    .dp-row {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
    }

    .dp-row:last-child {
      border-bottom: none;
    }

    .dp-key {
      color: var(--text3);
    }

    .dp-val {
      color: var(--text);
    }

    .dp-val.gold {
      color: var(--gold);
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
    }
  </style>
</head>

<body>

  <nav class="topnav">
    <a href="role-select.html" class="nav-logo">Ne<span>x</span>row</a>
    <div class="nav-right">
      <span class="nav-user" id="navUser"></span>
      <button class="nav-logout" id="logoutBtn">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div class="join-wrap">
      <div class="page-header fade-up">
        <div class="tag">// Client Mode</div>
        <h1>Join a Deal</h1>
        <p class="mt-2" style="font-size:0.88rem">Enter the unique deal code shared by your freelancer to connect and
          start the escrow process.</p>
      </div>
      <div id="alertBox"></div>
      <div class="code-input-wrap fade-up">
        <div class="card-title" style="margin-bottom:1rem;justify-content:center">Enter Deal Code</div>
        <input type="text" class="code-input" id="dealCode" placeholder="SUPX-XXXXX" maxlength="10" />
        <p style="font-family:'DM Mono',monospace;font-size:0.68rem;color:var(--text3);margin-top:0.8rem">
          Get this code from your freelancer
        </p>
      </div>
      <button class="btn btn-gold btn-full fade-up" id="searchBtn">🔍 Search Deal</button>
      <div class="deal-preview" id="dealPreview">
        <div class="card-title" style="margin-bottom:1rem">Deal Found</div>
        <div class="dp-row"><span class="dp-key">Code</span><span class="dp-val" id="prevCode">—</span></div>
        <div class="dp-row"><span class="dp-key">Title</span><span class="dp-val" id="prevTitle">—</span></div>
        <div class="dp-row"><span class="dp-key">Freelancer</span><span class="dp-val" id="prevFreelancer">—</span>
        </div>
        <div class="dp-row"><span class="dp-key">Deadline</span><span class="dp-val" id="prevDeadline">—</span></div>
        <div class="dp-row"><span class="dp-key">Budget</span><span class="dp-val gold" id="prevBudget">—</span></div>
        <div style="margin-top: 1.2rem; text-align: left;">
          <label style="font-family:'DM Mono',monospace; font-size:0.72rem; color:var(--text2); display:block; margin-bottom:0.4rem">Your Mobile Number (For OTP Delivery)</label>
          <input type="tel" id="clientPhone" placeholder="Enter 10-digit number" maxlength="10" 
                 style="width:100%; padding:0.6rem; background:rgba(255,255,255,0.03); border:1px solid var(--border); color:var(--text1); font-family:'DM Mono',monospace; font-size:0.85rem; outline:none; border-radius: 4px;" />
        </div>
        <button class="btn btn-green btn-full mt-3" id="joinBtn">🤝 Join This Deal</button>
      </div>
      <div style="text-align:center;margin-top:1.5rem">
        <a href="role-select.html"
          style="font-family:'DM Mono',monospace;font-size:0.68rem;color:var(--text3);text-decoration:none">← Back to
          role selection</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="../js/auth.js"></script>
  <script>
    
    function showAlert(containerId, type, message) {
      const icons = { error: '✕', success: '✓', info: 'ℹ', warning: '⚠' };
      const el = document.getElementById(containerId);
      if (!el) return;
      el.innerHTML = `<div class='alert alert-${type}'><span>${icons[type] || '•'}</span><span>${message}</span></div>`;
      setTimeout(() => { el.innerHTML = ''; }, 5000);
    }

    let foundDealDocId = null;
    let foundDealData = null;
    let currentUser = null;

    requireAuth((user) => {
      currentUser = user;
      setNavUser(user);
      setupLogout();
    });

    document.getElementById('searchBtn').addEventListener('click', async () => {
      const code = document.getElementById('dealCode').value.trim().toUpperCase();
      const btn = document.getElementById('searchBtn');
      if (!code) return showAlert('alertBox', 'error', 'Please enter a deal code.');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Searching...';

      try {
        const { data: deals, error } = await supabase.from('deals').select('*').eq('unique_code', code);
        if (error) throw error;
        if (!deals || deals.length === 0) {
          showAlert('alertBox', 'error', 'Deal not found. Please check the code and try again.');
          btn.disabled = false; btn.innerHTML = '🔍 Search Deal';
          document.getElementById('dealPreview').classList.remove('show');
          return;
        }
        const dealDoc = deals[0];
        foundDealDocId = dealDoc.id;
        foundDealData = dealDoc;

        if (foundDealData.client_id && foundDealData.client_id !== currentUser.id) {
          showAlert('alertBox', 'error', 'This deal already has a client connected.');
          btn.disabled = false; btn.innerHTML = '🔍 Search Deal'; return;
        }
        if (foundDealData.freelancer_id === currentUser.id) {
          showAlert('alertBox', 'error', 'You are the freelancer on this deal. You cannot join as client.');
          btn.disabled = false; btn.innerHTML = '🔍 Search Deal'; return;
        }

        document.getElementById('prevCode').textContent = foundDealData.unique_code;
        document.getElementById('prevTitle').textContent = foundDealData.title;
        document.getElementById('prevFreelancer').textContent = foundDealData.freelancer_name || foundDealData.freelancer_email || '—';
        document.getElementById('prevDeadline').textContent = foundDealData.deadline || '—';
        document.getElementById('prevBudget').textContent = formatINR(foundDealData.budget);
        document.getElementById('dealPreview').classList.add('show');
        showAlert('alertBox', 'success', 'Deal found! Review the details and click Join.');

      } catch (e) {
        showAlert('alertBox', 'error', 'Search failed: ' + e.message);
      }
      btn.disabled = false;
      btn.innerHTML = '🔍 Search Deal';
    });

    document.getElementById('joinBtn').addEventListener('click', async () => {
      if (!foundDealDocId || !currentUser) return;
      const btn = document.getElementById('joinBtn');
      
      const phoneInput = document.getElementById('clientPhone').value.trim();
      if (!phoneInput) {
        showAlert('alertBox', 'error', 'Please enter your mobile number for OTP verification.');
        return;
      }
      if (!/^\d{10}$/.test(phoneInput)) {
        showAlert('alertBox', 'error', 'Please enter a valid 10-digit mobile number.');
        return;
      }

      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Joining...';

      try {
        const { error } = await supabase.from('deals').update({
          client_id: currentUser.id,
          client_email: currentUser.email,
          client_name: currentUser.email,
          client_phone: phoneInput,
          status: 'CLIENT_JOINED',
          participants: [foundDealData.freelancer_id, currentUser.id],
          client_joined_at: new Date().toISOString(),
          updated_at: new Date().toISOString()
        }).eq('id', foundDealDocId);
        if (error) throw error;
        showAlert('alertBox', 'success', 'Successfully joined! Redirecting to workspace...');
        setTimeout(() => { window.location.href = `status.html?id=${foundDealDocId}`; }, 1200);
      } catch (e) {
        showAlert('alertBox', 'error', 'Failed to join deal: ' + e.message);
        btn.disabled = false; btn.innerHTML = '🤝 Join This Deal';
      }
    });

    document.getElementById('dealCode').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('searchBtn').click();
    });
  </script>
</body>

</html>
